<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,nofollow">
    <title>Abriendo La Arroba…</title>
    <style>
        :root {
            color-scheme: light;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        body {
            align-items: center;
            background: #eef4d9;
            color: #173f31;
            display: flex;
            justify-content: center;
            margin: 0;
            min-height: 100vh;
        }

        main {
            background: #fff;
            border-radius: 1.25rem;
            box-shadow: 0 .5rem 2rem #173f3120;
            box-sizing: border-box;
            max-width: 34rem;
            padding: 2rem;
            text-align: center;
            width: calc(100% - 2rem);
        }

        a {
            color: #fff;
            background: #173f31;
            border-radius: .75rem;
            display: inline-block;
            padding: .75rem 1rem;
            text-decoration: none;
        }
    </style>
    <script>
        (function () {
            const playStoreAppUrl = "market://details?id=com.jeluchu.laarroba";
            const playStoreWebUrl = "https://play.google.com/store/apps/details?id=com.jeluchu.laarroba";
            const appStoreUrl = "https://apps.apple.com/es/app/la-arroba-comercio-y-usuarios/id1570044504";
            const websiteUrl = "https://www.laelipasiqueflipa.com/";
            const userAgent = navigator.userAgent || "";
            const isAndroid = /Android/i.test(userAgent);
            const isAppleMobile = /iPhone|iPad|iPod/i.test(userAgent)
                || (/Macintosh/i.test(userAgent) && navigator.maxTouchPoints > 1);

            if (isAndroid) {
                window.location.replace(playStoreAppUrl);
                window.setTimeout(function () {
                    if (document.visibilityState === "visible") {
                        window.location.replace(playStoreWebUrl);
                    }
                }, 1200);
                return;
            }

            const destination = isAppleMobile ? appStoreUrl : websiteUrl;

            window.location.replace(destination);
        })();
    </script>
</head>

<body>
    <main>
        <h1>Abriendo La Arroba…</h1>
        <p>Si no se abre automáticamente, continúa desde aquí.</p>
        <a href="https://www.laelipasiqueflipa.com/">Ir a la web</a>
    </main>
</body>

</html>
